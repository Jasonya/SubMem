name: submem
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pytorch::pytorch>=2.1
  - pytorch::pytorch-cuda=12.1
  - pip:
      # Core
      - transformers>=4.40
      - accelerate>=0.25
      - numpy>=1.24
      - pandas>=2.0
      - pyarrow>=12.0
      - scikit-learn>=1.3
      - huggingface_hub>=0.20
      - faiss-cpu>=1.7.4
      - rank-bm25>=0.2.2
      - jinja2
      - tiktoken
      - tqdm
      # LLM clients
      - openai>=1.0
      # Parametric / KV configs
      - peft>=0.11
      - bitsandbytes>=0.43
      # Retrieval / agent stores
      - chromadb==1.5.5
      - mem0ai==2.0.0
      - graphiti-core==0.28.2
      # A-Mem official library (C16). Installed as editable from the
      # cloned upstream repo via setup_env.sh (agiresearch/A-mem).
